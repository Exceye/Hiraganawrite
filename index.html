<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiragana Quest! ✨</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Animasi Sakura Jatuh -->
    <div class="sakura-container" id="sakura-container"></div>

    <div class="container">
        
        <!-- MASCOT SECTION -->
        <div class="mascot-header">
            <div class="mascot-avatar">
                <!-- Maskot Anime Chibi Gaya Baru -->
                <svg viewBox="0 0 120 120" width="70" height="70">
                    <!-- Rambut Belakang -->
                    <circle cx="60" cy="65" r="45" fill="#f43f5e"/>
                    <!-- Wajah -->
                    <circle cx="60" cy="65" r="38" fill="#ffedd5"/>
                    <!-- Mata Anime -->
                    <ellipse cx="48" cy="60" rx="6" ry="8" fill="#1f2937"/>
                    <ellipse cx="72" cy="60" rx="6" ry="8" fill="#1f2937"/>
                    <circle cx="46" cy="57" r="2" fill="#ffffff"/>
                    <circle cx="70" cy="57" r="2" fill="#ffffff"/>
                    <!-- Blush (Pipi Merah) -->
                    <ellipse cx="40" cy="68" rx="5" ry="3" fill="#fda4af" opacity="0.8"/>
                    <ellipse cx="80" cy="68" rx="5" ry="3" fill="#fda4af" opacity="0.8"/>
                    <!-- Mulut Senyum -->
                    <path d="M 55 74 Q 60 80 65 74" stroke="#db2777" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <!-- Poni Rambut Anime -->
                    <path d="M 30 50 Q 50 35 60 50 Q 70 35 90 50 Q 75 30 60 30 Q 45 30 30 50 Z" fill="#e11d48"/>
                </svg>
            </div>
            <div class="mascot-speech" id="speech-bubble">
                "Konnichiwa! Siap Taklukkan Hiragana Hari Ini? 🌸"
            </div>
        </div>

        <!-- HALAMAN 1: PILIH HIRAGANA -->
        <div id="selection-screen" class="screen active">
            <h1>🌸 HIRAGANA QUEST 🌸</h1>
            <p>Pilih karakter yang mau kamu latih. Ayo mulai berpetualang!</p>
            
            <div class="select-controls">
                <button id="select-all" class="btn-secondary">✨ Pilih Semua</button>
                <button id="deselect-all" class="btn-secondary">❌ Batalkan</button>
            </div>

            <div id="hiragana-checkboxes" class="grid-checkboxes"></div>

            <button id="start-btn" class="btn-primary">🎮 MULAI LATIHAN (50 SOAL)</button>
        </div>

        <!-- HALAMAN 2: KUIS & LIVE SCORE -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-top-bar">
                <span id="progress-text">Soal 1 / 50</span>
                <div class="live-score-board">
                    <span class="score-badge correct">Benar: <strong id="live-correct">0</strong></span>
                    <span class="score-badge wrong">Salah: <strong id="live-wrong">0</strong></span>
                </div>
                <button id="quit-btn" class="btn-text">Keluar</button>
            </div>

            <div class="card" id="card-container">
                <h2 id="hiragana-target">あ</h2>
            </div>

            <div class="input-group">
                <input type="text" id="user-input" placeholder="Ketik romaji (mis: a)..." autocomplete="off" autofocus>
                <span id="feedback-msg"></span>
            </div>
        </div>

        <!-- HALAMAN 3: HASIL & KEMBANG API -->
        <div id="result-screen" class="screen">
            <div id="fireworks-container"></div>
            <h1>🎉 Sugoi! Latihan Selesai! 🎉</h1>
            <div class="result-stats">
                <p>Skor Benar: <span id="score-correct">0</span> / 50</p>
                <p>Akurasi Total: <span id="score-accuracy">0%</span></p>
            </div>
            
            <div id="mistake-container" class="mistake-box"></div>

            <button id="restart-btn" class="btn-primary">🔄 Main Lagi (Soal Sama)</button>
            <button id="menu-btn" class="btn-secondary">🏠 Pilih Huruf Lain</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
